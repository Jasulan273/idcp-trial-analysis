[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "idcp-trial-analysis"
version = "1.0.0"
description = "Descriptive analysis of paired IDCP coordination tasks"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
idcp-trial = "idcp_trial.__main__:main"

[tool.setuptools.packages.find]
include = ["idcp_trial*"]
