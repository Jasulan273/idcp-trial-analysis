name: Validate and deliver trial analysis
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check compilation
        run: python -m compileall -q idcp_trial
      - name: Run sample analysis
        run: python -m idcp_trial data/example_pairs.csv --output results
      - uses: actions/upload-artifact@v4
        with:
          name: sample-results-${{ matrix.python-version }}
          path: results/
  deliver:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package tested source
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=idcp-trial-analysis/ HEAD > dist/idcp-trial-analysis.zip
          sha256sum dist/idcp-trial-analysis.zip > dist/SHA256SUMS.txt
      - name: Deliver versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/idcp-trial-analysis.zip dist/SHA256SUMS.txt --title "$GITHUB_REF_NAME" --generate-notes
